<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<title>Photo Gallery</title>
	<link rel="stylesheet" href="css/style.css">
</head>
<body onload="loadTabIndex()">
	
	<div id = "image">
		<p>Hover over an image below to display here.</p>
	</div>
	
	<img class = "preview" alt = "nostalgia inducing radio set" src = "images/2001_radio_set.png" onmouseover = "upDate(this)" onmouseout = "unDo()" onfocus="upDate(this)" onblur="unDo()">
	
	<img class = "preview" alt = "A cheap radio antenna" src = "images/antenna.png" onmouseover = "upDate(this)" onmouseout = "unDo()" onfocus="upDate(this)" onblur="unDo()">
	
	<img class = "preview" src = "images/crystal_radio_set.png" alt = "DIY Crystal Radio set" onmouseover = "upDate(this)" onmouseout = "unDo()" onfocus="upDate(this)" onblur="unDo()">

	<img class = "preview" src = "images/medium_size_radio_set.png" alt = "A medium sized professional radio set" onmouseover = "upDate(this)" onmouseout = "unDo()" onfocus="upDate(this)" onblur="unDo()">

	<img class = "preview" src = "images/radio_dial.jpg" alt = "glow-in-the-dark raio dial" onmouseover = "upDate(this)" onmouseout = "unDo()" onfocus="upDate(this)" onblur="unDo()">

	<img class = "preview" src = "images/radios_piled_up.png" alt = "A pileup of radios" onmouseover = "upDate(this)" onmouseout = "unDo()" onfocus="upDate(this)" onblur="unDo()">

	<img class = "preview" src = "images/sw_radio_set.png" alt = "A full spectrum professional SW Radio Set" onmouseover = "upDate(this)" onmouseout = "unDo()" onfocus="upDate(this)" onblur="unDo()">
</body>
<script src = "javascript/script.js"></script>
</html>
